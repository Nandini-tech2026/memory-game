<meta charset="utf-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4463373093160310"
     crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh;
    font-family: "Trebuchet MS", Arial, sans-serif; color: #3b2a63;
    background: linear-gradient(160deg, #ffd6ec 0%, #d9d2ff 50%, #c9f3ff 100%);
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 {
    text-align: center; font-size: 2.2rem; margin: 6px 0 14px;
    background: linear-gradient(90deg, #ff4fa3, #7a4dff, #00b4d8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel {
    background: rgba(255,255,255,0.75); border-radius: 20px; padding: 16px;
    box-shadow: 0 8px 20px rgba(122,77,255,0.18); margin-bottom: 16px;
  }
  input {
    width: 100%; padding: 14px; font-size: 1rem; border-radius: 14px;
    border: 2px solid #c9b8ff; margin-bottom: 10px; text-align: center;
  }
  .btn {
    padding: 13px 22px; font-size: 1rem; font-weight: bold; color: white;
    border: 0; border-radius: 30px; cursor: pointer;
    background: linear-gradient(90deg, #ff4fa3, #7a4dff);
    box-shadow: 0 5px 12px rgba(122,77,255,0.35);
  }
  .btn.small { padding: 8px 16px; font-size: 0.9rem; background: #9b8fc4; box-shadow: none; }
  .center { text-align: center; }
  .stats { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat {
    flex: 1; text-align: center; background: white; border-radius: 16px;
    padding: 8px 4px; box-shadow: 0 4px 10px rgba(122,77,255,0.15);
  }
  .stat b { display: block; font-size: 1.3rem; color: #7a4dff; }
  .stat span { font-size: 0.8rem; color: #8a7bb3; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card {
    aspect-ratio: 1; border: 0; border-radius: 16px; font-size: 2rem;
    color: white; font-weight: bold; cursor: pointer;
    background: linear-gradient(135deg, #ff4fa3, #7a4dff);
    box-shadow: 0 5px 10px rgba(122,77,255,0.35);
    transition: transform 0.2s;
  }
  .card.open { background: white; color: black; transform: scale(1.06); }
  .card.done { background: linear-gradient(135deg, #b9f6ca, #69f0ae); transform: scale(1); }
  #msg { text-align: center; font-size: 1.25rem; font-weight: bold; min-height: 32px; margin: 12px 0; }
  h2 { margin: 0 0 8px; font-size: 1.2rem; color: #7a4dff; }
  ol { margin: 0 0 12px; padding-left: 22px; line-height: 1.8; }
  footer { text-align: center; font-size: 0.85rem; color: #6e5da0; padding: 8px 0 20px; }
</style>

<div class="wrap">
  <h1>Memory Match</h1>

  <div id="login" class="panel center">
    <p>Enter your name to play</p>
    <input id="name" type="text" maxlength="12" placeholder="Your name">
    <button id="start" class="btn">Start Game</button>
  </div>

  <div id="game" style="display:none">
    <div class="stats">
      <div class="stat"><b id="who">-</b><span>Player</span></div>
      <div class="stat"><b><span id="moves" style="font-size:1.3rem;color:#7a4dff">0</span>/15</b><span>Moves</span></div>
      <div class="stat"><b><span id="pairs" style="font-size:1.3rem;color:#7a4dff">0</span>/8</b><span>Pairs</span></div>
    </div>
    <div id="grid"></div>
    <p id="msg"></p>
    <div class="center">
      <button id="again" class="btn" style="display:none">Try again</button>
    </div>
  </div>

  <div class="panel">
    <h2>Leaderboard (best moves)</h2>
    <ol id="board"></ol>
    <button id="clear" class="btn small">Clear leaderboard</button>
  </div>

  <footer>
  © 2026 N@nadini. Memory Match.<br>
  <a href="about.html">About</a> |
  <a href="privacy.html">Privacy Policy</a> |
  <a href="contact.html">Contact</a>
  </footer>
</div>

<script>
  var MAX = 15;
  var PEEK = 2000;
  var emojis = ["🐱","🐶","🦊","🐼","🦁","🐸","🦄","🐙"];
  var grid = document.getElementById("grid");
  var first, locked, over, moves, pairs;
  var player = "";
  var audio = null;

  function beep(freq) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audio.createOscillator();
      osc.frequency.value = freq;
      osc.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.2);
    } catch (e) {}
  }

  function loadScores() {
    try {
      return JSON.parse(localStorage.getItem("memoryScores") || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveScores(list) {
    try {
      localStorage.setItem("memoryScores", JSON.stringify(list));
    } catch (e) {}
  }

  function showBoard() {
    var list = loadScores();
    list.sort(function (a, b) { return a.moves - b.moves; });
    var ol = document.getElementById("board");
    ol.innerHTML = "";
    if (list.length === 0) {
      ol.innerHTML = "<li>No wins yet. Be the first!</li>";
      return;
    }
    var medals = ["🥇", "🥈", "🥉"];
    for (var i = 0; i < list.length && i < 10; i++) {
      var li = document.createElement("li");
      var prefix = i < 3 ? medals[i] + " " : "";
      li.textContent = prefix + list[i].name + " - " + list[i].moves + " moves";
      ol.appendChild(li);
    }
  }

  function show(card) {
    card.textContent = card.dataset.emoji;
    card.classList.add("open");
  }

  function hide(card) {
    card.textContent = "?";
    card.classList.remove("open");
  }

  function endGame(won) {
    over = true;
    var msg = document.getElementById("msg");
    if (won) {
      msg.textContent = "🎉 Hurray " + player + "! You win in " + moves + " moves!";
      var list = loadScores();
      list.push({ name: player, moves: moves });
      saveScores(list);
      showBoard();
      beep(1000);
    } else {
      msg.textContent = "😢 " + player + ", you lose! 15 moves are over.";
      beep(200);
    }
    document.getElementById("again").style.display = "inline-block";
  }

  function tap(card) {
    if (locked || over || card === first || card.dataset.done) return;
    show(card);

    if (first === null) {
      first = card;
      return;
    }

    moves++;
    document.getElementById("moves").textContent = moves;

    if (first.dataset.emoji === card.dataset.emoji) {
      first.dataset.done = "yes";
      card.dataset.done = "yes";
      first.classList.remove("open");
      card.classList.remove("open");
      first.classList.add("done");
      card.classList.add("done");
      pairs++;
      document.getElementById("pairs").textContent = pairs;
      beep(700);
      first = null;
      if (pairs === 8) {
        endGame(true);
      } else if (moves >= MAX) {
        endGame(false);
      }
    } else {
      locked = true;
      var a = first;
      first = null;
      setTimeout(function () {
        hide(a);
        hide(card);
        locked = false;
      }, 800);
      if (moves >= MAX) {
        endGame(false);
      }
    }
  }

  function newGame() {
    var deck = emojis.concat(emojis);
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = deck[i];
      deck[i] = deck[j];
      deck[j] = temp;
    }
    first = null;
    over = false;
    moves = 0;
    pairs = 0;
    document.getElementById("moves").textContent = "0";
    document.getElementById("pairs").textContent = "0";
    document.getElementById("again").style.display = "none";
    grid.innerHTML = "";

    var all = [];
    for (var k = 0; k < deck.length; k++) {
      var card = document.createElement("button");
      card.className = "card";
      card.dataset.emoji = deck[k];
      card.onclick = function () { tap(this); };
      show(card);
      grid.appendChild(card);
      all.push(card);
    }

    locked = true;
    document.getElementById("msg").textContent = "Memorize the cards...";
    setTimeout(function () {
      for (var m = 0; m < all.length; m++) {
        hide(all[m]);
      }
      locked = false;
      document.getElementById("msg").textContent = "Go!";
    }, PEEK);
  }

  document.getElementById("start").onclick = function () {
    var n = document.getElementById("name").value.trim();
    if (!n) {
      alert("Please enter your name");
      return;
    }
    player = n;
    document.getElementById("who").textContent = player;
    document.getElementById("login").style.display = "none";
    document.getElementById("game").style.display = "block";
    newGame();
  };

  document.getElementById("again").onclick = newGame;

  document.getElementById("clear").onclick = function () {
    saveScores([]);
    showBoard();
  };

  showBoard();
  </script>
